# CI for a Go command-line tool released with GoReleaser, on the self-hosted Forgejo runner (`kit project ci`).
# The bridge mirrors every ref to Forgejo with a push (branches, pull requests as pr/<n>, tags): `on: [push]` covers
# them all. Actions are pinned by commit SHA on data.forgejo.org (a mirror of the GitHub actions); Renovate bumps the
# SHA from the version comment. No secret is used: this checks the release configuration and builds a snapshot, it
# publishes nothing (a release stays a local `goreleaser release`, or a later workflow with its own token).
# Go version: go.mod (`go` and `toolchain` lines). Needs .goreleaser.yaml (or .goreleaser.yml) at the root.
name: ci-go-cli
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  GOVULNCHECK_VERSION: v1.9.0
  GORELEASER_VERSION: v2.20.2

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Full history and tags: GoReleaser derives the snapshot version from the last tag.
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then printf 'not gofmt-ed:\n%s\n' "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      # No -race: the race detector needs a C compiler, which the default runner image does not ship.
      - name: test
        run: go test -count=1 ./...
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
      # GoReleaser from the Go toolchain (pinned module version) rather than a third-party action.
      - name: goreleaser check
        run: |
          go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          "$(go env GOPATH)/bin/goreleaser" check
      - name: goreleaser build (snapshot, every target)
        run: '"$(go env GOPATH)/bin/goreleaser" build --snapshot --clean'
