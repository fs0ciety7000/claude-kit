# CI for a Next.js application, on the self-hosted Forgejo runner (written by `kit project ci`).
# The bridge mirrors every ref to Forgejo with a push (branches, pull requests as pr/<n>, tags): `on: [push]` covers
# them all. Actions are pinned by commit SHA on data.forgejo.org (a mirror of the GitHub actions); Renovate (built-in
# github-actions manager, forgejo-tags) bumps the SHA from the version comment. No secret is used. Package manager: npm (package-lock.json committed).
name: ci-next
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  NODE_DEFAULT_VERSION: "26" # current Node LTS (Lithium), checked on nodejs.org 2026-11-13
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node version, first found: the Dockerfile (FROM node:<v>), .nvmrc, .node-version, package.json engines.node;
      # otherwise NODE_DEFAULT_VERSION (an exact major: `lts/*` needs the GitHub API, rate-limited without a token).
      - name: node version
        id: node
        run: |
          v=""; f=""
          if [ -f Dockerfile ]; then
            v=$(sed -nE 's/^FROM[[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?([^[:space:]]*\/)?node:([0-9][0-9.]*).*/\3/p' Dockerfile | head -n1)
          fi
          if [ -z "$v" ]; then
            for c in .nvmrc .node-version; do if [ -f "$c" ]; then f=$c; break; fi; done
          fi
          if [ -z "$v$f" ] && jq -e '.engines.node // empty' package.json >/dev/null 2>&1; then f=package.json; fi
          if [ -z "$v$f" ]; then v=$NODE_DEFAULT_VERSION; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "file=$f" >>"$GITHUB_OUTPUT"
      - uses: https://data.forgejo.org/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
      # Next.js build cache (incremental builds): saved per commit, restored from the latest one with the same lockfile.
      - uses: https://data.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: install
        run: npm ci
      - name: audit (high and critical)
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint --if-present
      - name: test
        run: npm test --if-present
      # `next build` also type-checks a TypeScript project (next-env.d.ts is generated there).
      - name: build
        run: npm run build
