# Rebuilds global/collections-index.json every Monday (and on demand) from global/agent-sources.txt, and proposes the
# change as a pull request: the index holds third-party text, so a human reads the summary before it lands.
# Two jobs: the build reads third-party repositories with a read-only token that is not kept on disk; the publish job
# never touches third-party repositories, it only commits the built file and opens the PR.
name: Collections index

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [global/agent-sources.txt, scripts/build-index.sh]

permissions: {}

concurrency:
  group: collections-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the index (shallow clones without links, no API, nothing executed)
        run: bash scripts/build-index.sh --out "$RUNNER_TEMP/collections-index.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collections-index
          path: ${{ runner.temp }}/collections-index.json
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collections-index
          path: ${{ runner.temp }}/new
      - name: Propose the update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          new="$RUNNER_TEMP/new/collections-index.json"
          old=global/collections-index.json
          if [ -f "$old" ] && jq -e --slurpfile o "$old" '(.entries == $o[0].entries) and (.sources | map(.source)) == ($o[0].sources | map(.source))' "$new" >/dev/null; then
            echo "index unchanged"; exit 0
          fi
          # Summary for the reviewer: a 2.6 MB JSON diff is not readable on GitHub.
          summary="$RUNNER_TEMP/summary.md"
          jq -rn --slurpfile n "$new" --slurpfile o "$( [ -f "$old" ] && echo "$old" || echo /dev/null)" '
            ($n[0]) as $N | (($o[0] // {entries: [], sources: []})) as $O
            | ($N.entries | map(.source + "/" + .path)) as $nk | ($O.entries | map(.source + "/" + .path)) as $ok
            | ($N.sources | map(.source)) as $ns | ($O.sources | map(.source)) as $os
            | ([$N.entries[] | select((.source + "/" + .path) as $k | $ok | index($k) | not)]) as $added
            | ([$O.entries[] | select((.source + "/" + .path) as $k | $nk | index($k) | not)]) as $removed
            | ([$N.entries[] | select((.description + " " + .name)
                 | test("(?i)ignore (all|previous)|IMPORTANT:|curl |wget |bash -c|base64|token|secret|password|api[_ -]?key|https?://"))]) as $flag
            | "Régénéré par `scripts/build-index.sh`. **Contenu tiers** : lire ce résumé, et les fichiers signalés avant fusion.\n\n"
              + "| | |\n|---|---|\n"
              + "| Entrées | \($O.entries | length) → \($N.count) (+\($added | length), −\($removed | length)) |\n"
              + "| Sources ajoutées | \([$ns[] | select(. as $s | $os | index($s) | not)] | join(", ") | if . == "" then "—" else . end) |\n"
              + "| Sources retirées | \([$os[] | select(. as $s | $ns | index($s) | not)] | join(", ") | if . == "" then "—" else . end) |\n\n"
              + "### Descriptions à relire (motifs sensibles : instructions, commandes, secrets, liens) : \($flag | length)\n\n"
              + ([$flag[0:40][] | "- `\(.source)/\(.path)` : \(.description[0:120])"] | join("\n"))
              + (if ($flag | length) > 40 then "\n- … et \(($flag | length) - 40) autres" else "" end)
              + "\n\n### Exemples d’entrées ajoutées\n\n"
              + ([$added[0:20][] | "- \(.kind) `\(.source)` : \(.name)"] | join("\n"))' >"$summary"
          cp "$new" "$old"
          # One dated branch per run (never a forced push).
          branch="kit/collections-index-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$old"
          git commit -m "Collections index: $(jq -r .count "$old") entries"
          git push origin "$branch"
          gh pr create --head "$branch" --base main --title "Index des collections : mise à jour" --body-file "$summary"
          # Then close the older open PRs of this workflow (same repository, opened by this bot only).
          for old_pr in $(gh pr list --state open --author app/github-actions --json number,headRefName,isCrossRepository \
                            --jq ".[] | select(.isCrossRepository == false and (.headRefName | startswith(\"kit/collections-index-\")) and .headRefName != \"$branch\") | .number"); do
            gh pr close "$old_pr" --delete-branch --comment "Remplacée par une mise à jour plus récente."
          done
